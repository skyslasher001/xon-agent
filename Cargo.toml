[workspace]
resolver = "3"
members = [
    "crates/kestrel-core",
    "crates/kestrel-venues",
    "crates/kestrel-store",
    "crates/kestrel-ingest",
    "crates/kestrel-state",
    "crates/kestrel-safety",
    "crates/kestrel-scorer",
    "crates/kestrel-pnl",
    "crates/kestrel-exec",
    "crates/kestrel-strategy",
    "crates/kestrel-risk",
    "crates/kestrel-portfolio",
    "crates/kestrel-engine",
    "crates/kestrel-bin",
    "crates/kestrel-indicators",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "5.5"
futures = "0.3"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
rust_decimal = { version = "1.35", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-sdk = { version = "2.0", features = [] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full", "tracing"] }
tokio-tungstenite = { version = "0.23", features = ["__rustls-tls"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls", "codegen"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
arrow = "53.0"
parquet = "53.0"
yellowstone-grpc-proto = { git = "https://github.com/rpcpool/yellowstone-grpc.git" }
yellowstone-grpc-client = { git = "https://github.com/rpcpool/yellowstone-grpc.git" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[workspace.lints.rust]
unsafe_code = "forbid"
unwrap_used = "deny"
expect_used = "deny"
unused_variables = "warn"
unused_mut = "warn"